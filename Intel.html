<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fahim's Health Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen projector game. Top bar (level path + team scores), stage = Fahim the robot beside a big question card. Single bright classroom look, same palette as the lesson slides. */
:root {
  --ink: #26215C;
  --ink-2: #4A4680;
  --muted: #6B6893;
  --paper: #F3F1FF;
  --card: #FFFFFF;
  --line: #E2DEF7;
  --coral: #FF6B6B;
  --coral-l: #FFE8E8;
  --sun: #FFC145;
  --sun-l: #FFF3D4;
  --mint: #2BB673;
  --mint-d: #1E8A55;
  --mint-l: #E1F6EA;
  --sky: #3FA7F5;
  --sky-l: #E2F1FE;
  --grape: #8E5CF2;
  --grape-l: #EEE6FE;
  --s-events: #FFBF00; --s-control: #FFAB19; --s-looks: #9966FF; --s-sensing: #5CB1D6; --s-ops: #59C059;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px;
  background-image: radial-gradient(circle at 1px 1px, #DCD7F7 1.2px, transparent 1.3px); background-size: 26px 26px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
.app { min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 18px; gap: 14px; max-width: 1280px; margin: 0 auto; }

/* ---------- top bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; margin: 0; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mint-d); }
.path { display: flex; gap: 6px; align-items: center; }
.path .step { display: flex; align-items: center; gap: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-weight: 800; font-size: 0.85rem; color: var(--muted); }
.path .step i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; color: #fff; background: var(--line); font-size: 0.75rem; }
.path .step.on { border-color: currentColor; }
.path .step.done i { background: var(--mint); }
.tools { display: flex; gap: 8px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="false"] { opacity: 0.55; }

.teams { display: flex; flex-wrap: wrap; gap: 14px 10px; padding-top: 6px; }
.team { flex: 1 1 150px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 16px; background: var(--card); border: 3px solid transparent; transition: transform .25s, border-color .25s; min-width: 0; }
.team .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.team .nm { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.team .pts { margin-left: auto; font-family: var(--display); font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.team.turn { border-color: var(--tc); transform: translateY(-2px); box-shadow: 0 6px 0 -2px var(--tc); }
.team { position: relative; }
.team.turn::after { content: "your turn"; position: absolute; top: -11px; left: 12px; background: var(--tc); color: #fff; padding: 1px 9px; border-radius: 99px; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }

/* ---------- stage ---------- */
.stage { flex: 1; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 18px; align-items: stretch; }
.byte-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; position: relative; }
.bubble { position: relative; background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 12px 16px; font-weight: 800; font-size: 1.05rem; line-height: 1.35; text-align: center; width: 100%; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 22px; height: 22px; background: var(--card); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.byte { width: min(230px, 100%); aspect-ratio: 355/520; position: relative; }
.byte img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 12px 10px rgba(38,33,92,.22)); }
.byte .badge { position: absolute; top: 2%; right: 0; width: 26%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: clamp(1.2rem, 3vw, 2.4rem); color: #fff; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(38,33,92,.25); }
.byte .badge.yes { background: var(--sun); } .byte .badge.no { background: var(--coral); } .byte .badge.q { background: var(--grape); }
.byte.no img { filter: grayscale(.35) drop-shadow(0 12px 10px rgba(38,33,92,.22)); }
.byte.idle { animation: bob 2.6s ease-in-out infinite; }
.byte.yay { animation: hop .5s ease 2; }
.byte.no { animation: shake .45s ease 1; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes hop { 40% { transform: translateY(-26px) rotate(-3deg); } }
@keyframes shake { 20%, 60% { transform: translateX(-10px) rotate(-3deg); } 40%, 80% { transform: translateX(10px) rotate(3deg); } }
.energy { width: 100%; background: var(--card); border-radius: 16px; padding: 10px 12px; border: 2px solid var(--line); }
.energy .lbl { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--mint-d); }
.energy .track { margin-top: 6px; height: 16px; border-radius: 99px; background: var(--mint-l); overflow: hidden; }
.energy .fill { height: 100%; width: 0; background: repeating-linear-gradient(-45deg, var(--mint) 0 10px, #39C882 10px 20px); border-radius: 99px; transition: width .6s cubic-bezier(.3,1.4,.6,1); }

.card { background: var(--card); border-radius: 28px; padding: clamp(16px, 3vw, 30px); box-shadow: 0 10px 0 -4px var(--line), 0 18px 40px -20px rgba(38,33,92,.35); display: flex; flex-direction: column; gap: 16px; min-width: 0; position: relative; }
.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 0.8rem; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
.qnum { font-weight: 800; color: var(--muted); font-size: 0.9rem; }
.timer { margin-left: auto; width: 58px; height: 58px; position: relative; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 7; }
.timer .bg { stroke: var(--line); }
.timer .fg { stroke: var(--sky); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
.timer b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.prompt { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 3.2vw, 2.4rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.prompt .if { color: var(--coral); } .prompt .then { color: var(--mint); } .prompt .else { color: var(--grape); }

.opts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 18px; border: 3px solid var(--line); background: var(--card); font-weight: 800; font-size: clamp(1.05rem, 1.8vw, 1.35rem); line-height: 1.2; transition: transform .15s, border-color .15s, background .2s; min-height: 76px; }
.opt:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--ink-2); }
.opt .key { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 1.2rem; }
.opt .pic { flex: none; font-size: 2rem; line-height: 1; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--mint); background: var(--mint-l); }
.opt.wrong { border-color: var(--coral); background: var(--coral-l); }
.opt.dim { opacity: .45; }
.tf { grid-template-columns: 1fr 1fr; }
.tf .opt { justify-content: center; font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.6rem); min-height: 120px; color: #fff; border: none; box-shadow: 0 8px 0 -2px rgba(0,0,0,.18); }
.tf .opt.t { background: var(--mint); } .tf .opt.f { background: var(--coral); }
.tf .opt.right { outline: 6px solid var(--ink); outline-offset: 3px; }
.tf .opt.wrong { filter: grayscale(.6); }

/* scratch blocks */
.code { display: flex; flex-direction: column; align-items: flex-start; padding: 14px; border-radius: 18px; background: #F6F7FB; border: 2px dashed var(--line); overflow-x: auto; font-size: clamp(0.9rem, 1.5vw, 1.1rem); }
.blk { color: #fff; font-weight: 700; padding: 8px 14px; border-radius: 6px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.blk.hat { border-radius: 22px 22px 6px 6px; padding-top: 12px; }
.in { background: #fff; color: #575E75; border-radius: 99px; padding: 2px 10px; }
.rep { background: var(--s-sensing); border: 1.5px solid #fff; border-radius: 99px; padding: 1px 9px; }
.bool { background: var(--s-ops); padding: 3px 14px; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); display: inline-flex; gap: 6px; align-items: center; }
.cblk { display: flex; flex-direction: column; align-items: flex-start; }
.cblk .arm { display: flex; }
.cblk .spine { width: 20px; background: var(--s-control); }
.cblk .inner { display: flex; flex-direction: column; align-items: flex-start; padding: 2px 0; }
.cblk .foot { height: 14px; width: 120px; background: var(--s-control); border-radius: 0 0 6px 6px; }
.flag { color: #4CBF56; font-size: 1.1em; }
.ev { background: var(--s-events); } .lk { background: var(--s-looks); } .sn { background: var(--s-sensing); } .ct { background: var(--s-control); }

/* order */
.slots { overflow-x: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 18px; background: #F6F7FB; border: 2px dashed var(--line); min-height: 120px; }
.slot { display: flex; align-items: center; gap: 10px; min-width: max-content; }
.slot .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-weight: 800; flex: none; }
.slot.filled .n { background: var(--ink); color: #fff; }
.pool { display: flex; flex-wrap: wrap; gap: 10px; }
.pool .blk { border: none; font-size: clamp(0.95rem, 1.6vw, 1.15rem); box-shadow: 0 5px 0 -1px rgba(0,0,0,.18); }
.pool .blk:disabled { opacity: .25; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* flow symbols */
.sym { width: 70px; height: 46px; flex: none; }

/* feedback */
.feedback { border-radius: 20px; padding: 14px 18px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 14px; align-items: start; animation: pop .35s ease; }
.feedback.ok { background: var(--mint-l); } .feedback.bad { background: var(--coral-l); }
.feedback .big { grid-row: span 2; font-family: var(--display); font-weight: 800; font-size: 1.8rem; line-height: 1; padding-top: 2px; }
.feedback.ok .big { color: var(--mint-d); } .feedback.bad .big { color: #D64545; }
.feedback p { margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
.feedback .tip { font-weight: 700; color: var(--ink-2); font-size: 1rem; }
.feedback .tip b { color: var(--mint-d); }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: auto; }
.btn { border: none; border-radius: 16px; padding: 12px 24px; font-weight: 800; font-size: 1.15rem; background: var(--ink); color: #fff; box-shadow: 0 6px 0 -1px #120F33; transition: transform .1s; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 -1px #120F33; }
.btn.ghost { background: var(--card); color: var(--ink); border: 3px solid var(--line); box-shadow: none; }
.btn.go { background: var(--mint); box-shadow: 0 6px 0 -1px var(--mint-d); }
.btn:disabled { opacity: .4; cursor: default; }
.hint { font-size: .85rem; color: var(--muted); font-weight: 700; }

/* setup + overlays */
.screen { flex: 1; display: grid; place-items: center; }
.panel { background: var(--card); border-radius: 32px; padding: clamp(20px, 4vw, 40px); width: min(980px, 100%); display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 28px; align-items: center; box-shadow: 0 10px 0 -4px var(--line), 0 30px 60px -30px rgba(38,33,92,.4); }
.panel h2 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: .95; margin: 0 0 8px; text-wrap: balance; }
.panel h2 span { color: var(--coral); }
.panel p.lead { margin: 0 0 18px; font-size: 1.1rem; line-height: 1.5; color: var(--ink-2); max-width: 52ch; }
.field { margin-bottom: 16px; }
.field > .lab { display: block; font-weight: 800; font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; }
.seg { display: inline-flex; background: var(--paper); border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: none; background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.names label { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; }
.names input { border: none; font: inherit; font-weight: 800; width: 100%; min-width: 0; padding: 6px 0; color: var(--ink); background: transparent; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; }
.lv { border-radius: 16px; padding: 10px 12px; font-weight: 800; font-size: .95rem; line-height: 1.25; }
.lv small { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; opacity: .8; }

.overlay { position: fixed; inset: 0; background: rgba(38,33,92,.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.overlay .panel { grid-template-columns: minmax(0, 220px) minmax(0, 1fr); }
.podium { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 18px; }
.podium .pl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; background: var(--paper); font-weight: 800; font-size: 1.15rem; }
.podium .pl:first-child { background: var(--sun-l); font-size: 1.35rem; }
.podium .pl .medal { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--display); flex: none; }
.podium .pl b { margin-left: auto; font-family: var(--display); font-variant-numeric: tabular-nums; }

canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }

@media (max-width: 760px) {
  .stage { grid-template-columns: 1fr; }
  .byte-col { flex-direction: row; align-items: center; justify-content: flex-start; }
  .byte { width: 90px; flex: none; }
  .byte-col .bubble { font-size: .95rem; }
  .bubble::after { left: -10px; top: 50%; bottom: auto; transform: translateY(-50%) rotate(135deg); }
  .energy { display: none; }
  .panel, .overlay .panel { grid-template-columns: 1fr; }
  .panel .byte { width: 120px; margin: 0 auto; }
  .levels { grid-template-columns: 1fr; }
  .path .step span { display: none; }
  .tf .opt { min-height: 90px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <div>
        <small>Health Week · أسبوع الصحة</small>
        <h1>Fahim's Health Quest</h1>
      </div>
    </div>
    <nav class="path" id="path" aria-label="Levels"></nav>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" aria-pressed="true" title="Sound on/off" aria-label="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <button class="icon-btn" id="fsBtn" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="homeBtn" title="New game" aria-label="New game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      </button>
    </div>
  </header>
  <div class="teams" id="teams"></div>
  <main id="main" class="screen"></main>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {

  function robot(pose) {
    const badge = { cheer: '<span class="badge yes">&#9733;</span>', oops: '<span class="badge no">!</span>', think: '<span class="badge q">?</span>' }[pose] || '';

  // ---------- Scratch-style code helpers ----------
  const flag = '<span class="flag" aria-label="green flag">&#9873;</span>';
  const hat = () => `<div class="blk hat ev">when ${flag} clicked</div>`;
  const ask = (q) => `<div class="blk sn">ask <span class="in">${q}</span> and wait</div>`;
  const say = (t) => `<div class="blk lk">say <span class="in">${t}</span></div>`;

  const cond = (op, v) => `<span class="rep">answer</span> ${op} <span class="in">${v}</span>`;

  const SYM = {
    oval: '<svg class="sym" viewBox="0 0 70 46"><ellipse cx="35" cy="23" rx="32" ry="19" fill="#FFC145" stroke="#26215C" stroke-width="3"/></svg>',
    para: '<svg class="sym" viewBox="0 0 70 46"><path d="M16 4 H67 L54 42 H3 Z" fill="#3FA7F5" stroke="#26215C" stroke-width="3"/></svg>',
    dia: '<svg class="sym" viewBox="0 0 70 46"><path d="M35 2 L67 23 L35 44 L3 23 Z" fill="#FF6B6B" stroke="#26215C" stroke-width="3"/></svg>',
    rect: '<svg class="sym" viewBox="0 0 70 46"><rect x="4" y="6" width="62" height="34" fill="#2BB673" stroke="#26215C" stroke-width="3"/></svg>',
  };

  // ---------- Levels and questions ----------
  const LEVELS = [
    { name: 'Healthy or Not?', tag: 'TRUE or FALSE', color: C.sky, light: 'var(--sky-l)', intro: 'Read each IF… THEN… habit. Is it a healthy rule? Choose TRUE or FALSE.' },
    { name: 'IF… THEN…', tag: 'Pick the healthy THEN', color: C.mint, light: 'var(--mint-l)', intro: 'Every healthy habit is a decision. Choose the best THEN for each IF.' },
    { name: 'IF… THEN… ELSE', tag: 'Finish and fix the rule', color: C.grape, light: 'var(--grape-l)', intro: 'Finish Fahim’s rules with a healthy ELSE, find the condition and fix unhealthy rules.' },
  ];
  const IF = '<span class="if">IF</span>', THEN = '<span class="then">THEN</span>', ELSE = '<span class="else">ELSE</span>';
  const Q = [
    // Level 1: is this a healthy IF-THEN habit?
    { lv: 0, type: 'tf', prompt: `${IF} I am thirsty ${THEN} I drink water.`, answer: 0, byte: 'Healthy rule: TRUE or FALSE?', explain: 'TRUE. Water is the best drink when you are thirsty. It keeps your body cool and your brain working.', tip: 'Keep a water bottle on your desk and sip through the day.' },
    { lv: 0, type: 'tf', prompt: `${IF} I want a snack ${THEN} I eat a bag of chips every time.`, answer: 1, byte: 'Is this a healthy habit?', explain: 'FALSE. Chips have lots of salt and oil. A healthier rule: IF I want a snack THEN I eat fruit or vegetables.', tip: 'Pack an apple, a banana or carrot sticks.' },
    { lv: 0, type: 'tf', prompt: `${IF} I am going to eat ${THEN} I wash my hands with soap.`, answer: 0, byte: 'TRUE or FALSE?', explain: 'TRUE. Soap removes germs that can make you ill.', tip: 'Scrub for 20 seconds, about as long as singing “Happy Birthday” twice.' },
    { lv: 0, type: 'tf', prompt: `${IF} it is bedtime ${THEN} I play video games until midnight.`, answer: 1, byte: 'Hmm, think about it…', explain: 'FALSE. Your body and brain need sleep to grow. A healthier rule: IF it is bedtime THEN I switch off screens and sleep.', tip: 'Children need about 9–11 hours of sleep each night.' },
    { lv: 0, type: 'tf', prompt: `${IF} I have used a screen for 1 hour ${THEN} I take an active break.`, answer: 0, byte: 'Healthy rule?', explain: 'TRUE. Moving after screen time rests your eyes and wakes up your body.', tip: 'Try 10 star jumps or a quick walk.' },
    // Level 2: choose the healthy THEN
    { lv: 1, type: 'mc', prompt: `${IF} it is break time ${THEN}…`, options: [['\u{1F3C3}', 'run and play outside'], ['\u{1F4F1}', 'sit and watch videos'], ['\u{1F634}', 'sleep at my desk']], answer: 0, byte: 'Break time! What should we do?', explain: 'Run and play. Moving your body helps you learn better afterwards.', tip: 'Try to be active for 60 minutes every day.' },
    { lv: 1, type: 'mc', prompt: `${IF} it is very hot outside ${THEN}…`, options: [['\u{1F4A7}', 'drink water and stay in the shade'], ['\u{1F964}', 'drink a fizzy soda'], ['☀️', 'play in the sun with no hat']], answer: 0, byte: 'It’s a hot day in the UAE!', explain: 'Drink water and stay in the shade so your body does not get too hot.', tip: 'Wear a hat and drink extra water on hot days.' },
    { lv: 1, type: 'mc', prompt: `${IF} I need to sneeze or cough ${THEN}…`, options: [['\u{1F927}', 'sneeze on my friends'], ['\u{1F4AA}', 'cover my mouth with a tissue or my elbow'], ['✋', 'sneeze into my hands and keep playing']], answer: 1, byte: 'Aaachoo! What now?', explain: 'Cover your mouth with a tissue or your elbow so germs do not spread.', tip: 'Throw the tissue away and wash your hands.' },
    { lv: 1, type: 'mc', prompt: `${IF} I wake up in the morning ${THEN}…`, options: [['\u{1F4F1}', 'check my phone in bed'], ['\u{1F6AB}', 'skip breakfast'], ['\u{1FAA5}', 'brush my teeth and eat breakfast']], answer: 2, byte: 'Good morning! What comes first?', explain: 'Brush your teeth and eat breakfast. Breakfast gives you energy for learning.', tip: 'Brush your teeth twice a day for 2 minutes.' },
    { lv: 1, type: 'mc', prompt: `${IF} my lunchbox has no vegetables ${THEN}…`, options: [['\u{1F955}', 'add carrots or cucumber'], ['\u{1F36C}', 'add sweets instead'], ['\u{1F5D1}️', 'throw my lunch away']], answer: 0, byte: 'Let’s check the lunchbox!', explain: 'Add carrots or cucumber. Vegetables give you vitamins to stay strong.', tip: 'Try to eat a rainbow of colours every day.' },
    // Level 3: ELSE, condition and fixing rules
    { lv: 2, type: 'mc', prompt: `${IF} it is raining ${THEN} play indoor exercise games ${ELSE}…`, options: [['⚽', 'play outside'], ['\u{1F6CB}️', 'sit on the sofa all day'], ['\u{1F36D}', 'eat sweets instead of playing']], answer: 0, byte: 'Finish my rule with a healthy ELSE!', explain: 'ELSE play outside. ELSE is what happens when the condition is FALSE: it is not raining, so you can play outside.', tip: 'Being active every day keeps your heart strong.' },
    { lv: 2, type: 'mc', prompt: `What is the CONDITION in: ${IF} my hands are dirty ${THEN} wash them with soap?`, options: [['\u{1F450}', 'my hands are dirty'], ['\u{1F9FC}', 'wash them with soap'], ['\u{1F524}', 'the word THEN']], answer: 0, byte: 'Condition or action?', explain: '“my hands are dirty” is the condition. It comes after IF and can be TRUE or FALSE. “wash them with soap” is the action.', tip: 'Wash your hands after the toilet and before eating.' },
    { lv: 2, type: 'mc', prompt: `${IF} I feel tired at night ${THEN} go to sleep ${ELSE}…`, options: [['⚡', 'drink an energy drink'], ['\u{1F4D6}', 'read a book quietly'], ['\u{1F3AE}', 'play games until late']], answer: 1, byte: 'What is a calm, healthy ELSE?', explain: 'Read a book quietly. It helps your body get ready for sleep. Energy drinks and late games keep you awake.', tip: 'Switch off screens an hour before bed.' },
    { lv: 2, type: 'mc', prompt: `Fahim says: <b>“${IF} you are hungry ${THEN} eat 5 chocolate bars.”</b> Which rule fixes it?`, options: [['\u{1F34E}', 'IF you are hungry THEN eat fruit or a healthy snack'], ['\u{1F36B}', 'IF you are hungry THEN eat 10 chocolate bars'], ['\u{1F6AB}', 'IF you are hungry THEN never eat']], answer: 0, byte: 'I am a robot. Trust me! … or should you?', explain: 'Eat fruit or a healthy snack. Robots and AI can make mistakes, so always think, check and fix their rules.', tip: 'AI can help, but YOU think, check and decide.' },
    { lv: 2, type: 'mc', prompt: 'Which IF… THEN… rule keeps your teeth healthy?', options: [['\u{1F36C}', 'IF I eat sweets THEN I eat more sweets'], ['\u{1FAA5}', 'IF I eat sweets THEN I brush my teeth after'], ['\u{1F6B1}', 'IF my teeth hurt THEN I drink soda']], answer: 1, byte: 'Only one rule is healthy…', explain: 'Brush your teeth after sweets so sugar does not damage them.', tip: 'Visit the dentist and brush twice a day.' },
  ];
  const TEAM_DEFAULTS = [['Apples', C.coral], ['Water Drops', C.sky], ['Sunshine', C.sun], ['Runners', C.mint]];
  const TIME = 25;

  // ---------- State ----------
  let S = fresh();
  function fresh() {
    return { screen: 'setup', nTeams: 2, names: TEAM_DEFAULTS.map((t) => t[0]), timerOn: true, teams: [], turn: 0, qi: 0, answered: false, picked: null, correct: false, energy: 0, levelScore: [0, 0, 0], seq: [], introShown: -1 };
  }
  let sound = true, tick = null, left = TIME;

  const $ = (s, r = document) => r.querySelector(s);
  const main = $('#main');

  // ---------- Sound ----------
  let ac;
  function beep(freqs, dur = 0.12, type = 'triangle') {
    if (!sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      let t = ac.currentTime;
      for (const f of freqs) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.start(t); o.stop(t + dur + 0.02); t += dur * 0.85;
      }
    } catch (e) {}
  }
  const sfx = { ok: () => beep([523, 659, 784, 1047], 0.13), bad: () => beep([311, 233], 0.22, 'sawtooth'), tap: () => beep([660], 0.05), tick: () => beep([880], 0.04, 'square'), win: () => beep([523, 659, 784, 659, 784, 1047], 0.16) };

  // ---------- Confetti ----------
  const cv = $('#confetti'), cx = cv.getContext('2d');
  let parts = [], raf = null;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti(n = 120) {
    if (reduce) return;
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = [C.coral, C.sun, C.mint, C.sky, C.grape];
    for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 300, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[i % 5], a: Math.random() * 6, life: 120 });
    if (!raf) loop();
  }
  function loop() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter((p) => p.life-- > 0);
    for (const p of parts) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += 0.2; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); }
    raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0, 0, cv.width, cv.height), null);
  }

  // ---------- Render: chrome ----------
  function renderPath() {
    const lv = S.screen === 'game' ? Q[S.qi].lv : S.screen === 'end' ? 3 : -1;
    $('#path').innerHTML = LEVELS.map((l, i) => `<div class="step ${i === lv ? 'on' : ''} ${i < lv ? 'done' : ''}" style="${i === lv ? 'color:' + l.color : ''}"><i style="${i === lv ? 'background:' + l.color : ''}">${i < lv ? '✓' : i + 1}</i><span>${l.name}</span></div>`).join('');
  }
  function renderTeams() {
    const el = $('#teams');
    if (S.screen === 'setup') { el.innerHTML = ''; return; }
    el.innerHTML = S.teams.map((t, i) => `<div class="team ${i === S.turn && S.screen === 'game' && S.teams.length > 1 ? 'turn' : ''}" style="--tc:${t.color}"><span class="dot" style="background:${t.color}"></span><span class="nm">${esc(t.name)}</span><span class="pts" id="pts${i}">${t.score}</span></div>`).join('');
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- Setup screen ----------
  function renderSetup() {
    stopTimer();
    main.className = 'screen';
    main.innerHTML = `<section class="panel">
      <div class="byte idle">${robot('wave')}</div>
      <div>
        <h2>Help Fahim make <span>healthy choices!</span></h2>
        <p class="lead">Answer 15 Health Week questions about healthy IF… THEN… habits. Every right answer fills Fahim’s energy bar.</p>
        <div class="levels">${LEVELS.map((l, i) => `<div class="lv" style="background:${l.light}"><small style="color:${l.color}">Level ${i + 1} · ${l.tag}</small>${l.name}</div>`).join('')}</div>
        <div class="field"><span class="lab">How many teams?</span>
          <div class="seg" role="group" aria-label="Number of teams">${[1, 2, 3, 4].map((n) => `<button data-n="${n}" aria-pressed="${S.nTeams === n}">${n === 1 ? 'Whole class' : n + ' teams'}</button>`).join('')}</div>
        </div>
        <div class="field" ${S.nTeams === 1 ? 'hidden' : ''}><span class="lab">Team names</span>
          <div class="names">${TEAM_DEFAULTS.slice(0, S.nTeams).map((t, i) => `<label style="border-color:${t[1]}"><span class="dot" style="width:12px;height:12px;border-radius:50%;background:${t[1]};flex:none"></span><input id="team${i}" value="${esc(S.names[i])}" maxlength="18" aria-label="Team ${i + 1} name"></label>`).join('')}</div>
        </div>
        <div class="field"><span class="lab">Timer</span>
          <div class="seg" role="group" aria-label="Timer"><button data-t="1" aria-pressed="${S.timerOn}">${TIME} seconds</button><button data-t="0" aria-pressed="${!S.timerOn}">No timer</button></div>
        </div>
        <div class="row" style="align-items:center"><button class="btn go" id="startBtn">Start the quest</button><span class="hint">Keys: 1–4 or T/F to answer · Enter for next</span></div>
      </div></section>`;
    main.querySelectorAll('[data-n]').forEach((b) => b.onclick = () => { saveNames(); S.nTeams = +b.dataset.n; render(); });
    main.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { saveNames(); S.timerOn = b.dataset.t === '1'; render(); });
    $('#startBtn').onclick = startGame;
  }
  function saveNames() { for (let i = 0; i < 4; i++) { const el = $('#team' + i); if (el) S.names[i] = el.value.trim() || TEAM_DEFAULTS[i][0]; } }
  function startGame() {
    saveNames();
    S.teams = S.nTeams === 1 ? [{ name: 'Grade 4', color: C.grape, score: 0 }] : TEAM_DEFAULTS.slice(0, S.nTeams).map((t, i) => ({ name: S.names[i], color: t[1], score: 0 }));
    Object.assign(S, { screen: 'game', turn: 0, qi: 0, answered: false, picked: null, energy: 0, levelScore: [0, 0, 0], seq: [], introShown: -1 });
    sfx.tap();
    render();
  }

  // ---------- Game screen ----------
  function renderGame() {
    const q = Q[S.qi], L = LEVELS[q.lv];
    if (S.introShown < q.lv) return renderLevelIntro(q.lv);
    main.className = 'stage';
    const pose = S.answered ? (S.correct ? 'cheer' : 'oops') : q.lv === 2 ? 'think' : q.type === 'tf' ? 'point' : 'water';
    const team = S.teams[S.turn];
    const bubble = S.answered ? (S.correct ? pick(['Yes! You got it!', 'Brilliant thinking!', 'Beep boop, correct!', 'Super healthy answer!']) : (S.picked === -1 ? 'Time’s up! Let’s learn it.' : 'Oops! Let’s check together.')) : (S.teams.length > 1 ? `${esc(team.name)}: ` : '') + q.byte;
    const qInLevel = Q.filter((x) => x.lv === q.lv).indexOf(q) + 1;
    main.innerHTML = `
      <aside class="byte-col">
        <div class="bubble" aria-live="polite">${bubble}</div>
        <div class="byte ${S.answered ? (S.correct ? 'yay' : 'no') : 'idle'}">${robot(pose)}</div>
        <div class="energy"><div class="lbl"><span>Fahim’s energy</span><span>${Math.round(S.energy / Q.length * 100)}%</span></div><div class="track"><div class="fill" style="width:${S.energy / Q.length * 100}%"></div></div></div>
      </aside>
      <section class="card">
        <div class="qhead">
          <span class="chip" style="background:${L.color}">Level ${q.lv + 1} · ${L.name}</span>
          <span class="qnum">Question ${qInLevel} of 5 · ${S.qi + 1}/${Q.length}</span>
          ${S.timerOn && !S.answered ? `<div class="timer" aria-label="Time left"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" id="tfg" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="0"/></svg><b id="tnum">${TIME}</b></div>` : ''}
        </div>
        <h2 class="prompt">${q.prompt}</h2>
        ${body(q)}
        ${S.answered ? feedback(q) : ''}
        <div class="actions">${S.answered ? `<button class="btn go" id="nextBtn">${S.qi === Q.length - 1 ? 'See the winners' : 'Next question →'}</button>` : (q.type === 'order' ? `<button class="btn ghost" id="resetBtn">Clear</button><button class="btn" id="checkBtn" ${S.seq.length < q.blocks.length ? 'disabled' : ''}>Check my code</button>` : '')}</div>
      </section>`;
    wire(q);
    if (!S.answered && S.timerOn) startTimer(); else stopTimer();
    if (S.answered) $('#nextBtn').focus();
  }
  const pick = (a) => a[(S.qi * 7 + S.turn) % a.length];

  function body(q) {
    const keyColor = [C.sky, C.mint, C.grape, C.coral];
    const state = (i) => !S.answered ? '' : i === q.answer ? 'right' : i === S.picked ? 'wrong' : 'dim';
    if (q.type === 'tf') return `<div class="opts tf">${['TRUE', 'FALSE'].map((t, i) => `<button class="opt ${i ? 'f' : 't'} ${state(i)}" data-i="${i}" ${S.answered ? 'disabled' : ''}>${t} ${i ? '✖' : '✔'}</button>`).join('')}</div>`;
    let pre = '';
    if (q.type === 'code') pre = `<div class="code">${q.code}</div>`;
    if (q.type === 'order') return orderBody(q);
    const optHtml = q.options.map((o, i) => `<button class="opt ${state(i)}" data-i="${i}" ${S.answered ? 'disabled' : ''}><span class="key" style="background:${keyColor[i]}">${i + 1}</span>${q.type === 'flow' ? SYM[o[0]] : `<span class="pic" aria-hidden="true">${o[0]}</span>`}<span>${o[1]}</span></button>`).join('');
    return pre + `<div class="opts">${optHtml}</div>`;
  }
  function orderBody(q) {
    if (!S.order) S.order = shuffleIdx(q.blocks.length);
    const slots = q.blocks.map((_, k) => {
      const bi = S.seq[k];
      const good = S.answered ? bi === k : null;
      return `<div class="slot ${bi !== undefined ? 'filled' : ''}"><span class="n" style="${good === false ? 'background:' + C.coral : good ? 'background:' + C.mint : ''}">${k + 1}</span>${bi !== undefined ? `<div>${q.blocks[bi]}</div>` : '<span class="hint">tap a block below</span>'}</div>`;
    }).join('');
    const pool = S.answered ? '' : `<div class="pool">${S.order.map((bi) => `<button class="blk" style="padding:0;background:none" data-b="${bi}" ${S.seq.includes(bi) ? 'disabled' : ''}>${q.blocks[bi]}</button>`).join('')}</div>`;
    const answerKey = S.answered && !S.correct ? `<div><span class="hint">Correct order:</span><div class="code" style="margin-top:6px">${q.blocks.join('')}</div></div>` : '';
    return `<div class="slots">${slots}</div>${pool}${answerKey}`;
  }
  function shuffleIdx(n) { let a; do { a = [...Array(n).keys()].sort(() => Math.random() - .5); } while (a.every((v, i) => v === i)); return a; }
  function feedback(q) {
    return `<div class="feedback ${S.correct ? 'ok' : 'bad'}" role="status"><span class="big">${S.correct ? '+' + S.gain : '✖'}</span><p>${q.explain}</p><p class="tip"><b>Health tip:</b> ${q.tip}</p></div>`;
  }
  function wire(q) {
    main.querySelectorAll('.opt').forEach((b) => b.onclick = () => answer(+b.dataset.i));
    main.querySelectorAll('[data-b]').forEach((b) => b.onclick = () => { sfx.tap(); S.seq.push(+b.dataset.b); renderGame(); });
    const r = $('#resetBtn'); if (r) r.onclick = () => { S.seq = []; renderGame(); };
    const c = $('#checkBtn'); if (c) c.onclick = () => answer(S.seq.every((v, i) => v === i) ? 0 : 1, true);
    const n = $('#nextBtn'); if (n) n.onclick = next;
  }
  function answer(i, isOrder = false) {
    if (S.answered) return;
    const q = Q[S.qi];
    stopTimer();
    S.answered = true; S.picked = i;
    S.correct = isOrder ? i === 0 : i === q.answer;
    if (S.correct) {
      const bonus = S.timerOn ? Math.min(5, Math.ceil(left / 5)) : 0;
      S.gain = 10 + bonus;
      S.teams[S.turn].score += S.gain;
      S.energy += 1; S.levelScore[q.lv] += 1;
      sfx.ok(); confetti(90);
    } else { S.gain = 0; sfx.bad(); }
    render();
  }
  function next() {
    sfx.tap();
    if (S.qi === Q.length - 1) { S.screen = 'end'; render(); return; }
    S.qi += 1; S.turn = (S.turn + 1) % S.teams.length; S.answered = false; S.picked = null; S.seq = []; S.order = null;
    render();
  }

  // ---------- Timer ----------
  function startTimer() {
    stopTimer(); left = TIME;
    const fg = $('#tfg'), num = $('#tnum');
    tick = setInterval(() => {
      left -= 1;
      if (num) num.textContent = left;
      if (fg) { fg.style.strokeDashoffset = (169.6 * (1 - left / TIME)).toFixed(1); if (left <= 5) fg.style.stroke = C.coral; }
      if (left <= 5 && left > 0) sfx.tick();
      if (left <= 0) { stopTimer(); answer(-1); }
    }, 1000);
  }
  function stopTimer() { if (tick) clearInterval(tick); tick = null; }

  // ---------- Level intro ----------
  function renderLevelIntro(lv) {
    stopTimer();
    const L = LEVELS[lv];
    main.className = 'screen';
    main.innerHTML = `<section class="panel" style="grid-template-columns:minmax(0,220px) minmax(0,1fr)">
      <div class="byte idle">${robot(lv === 0 ? 'point' : lv === 1 ? 'water' : 'think')}</div>
      <div><span class="chip" style="background:${L.color}">Level ${lv + 1} of 3 · ${L.tag}</span>
        <h2 style="margin-top:12px">${L.name}</h2>
        <p class="lead">${L.intro}</p>
        ${lv > 0 ? `<p class="lead" style="margin-top:-8px"><b>Level ${lv} result:</b> ${S.levelScore[lv - 1]} of 5 correct.</p>` : ''}
        <button class="btn go" id="goBtn">Let’s go!</button></div></section>`;
    $('#goBtn').onclick = () => { S.introShown = lv; sfx.tap(); render(); };
    $('#goBtn').focus();
  }

  // ---------- End screen ----------
  function renderEnd() {
    stopTimer();
    main.className = 'screen';
    const ranked = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
    const total = S.levelScore.reduce((a, b) => a + b, 0);
    const medal = [C.sun, '#A7A9C4', '#D38B5D', C.sky];
    main.innerHTML = `<section class="panel">
      <div class="byte yay">${robot('cheer')}</div>
      <div><h2>${total >= 12 ? 'Fahim is <span>fully charged!</span>' : total >= 8 ? 'Great job, <span>healthy coders!</span>' : 'Good try, <span>let’s keep learning!</span>'}</h2>
        <p class="lead">The class got <b>${total} of ${Q.length}</b> right. Healthy or not: ${S.levelScore[0]}/5 · IF…THEN: ${S.levelScore[1]}/5 · IF…THEN…ELSE: ${S.levelScore[2]}/5</p>
        ${S.teams.length > 1 ? `<div class="podium">${ranked.map((t, k) => `<div class="pl"><span class="medal" style="background:${medal[k]}">${k + 1}</span><span class="dot" style="width:12px;height:12px;border-radius:50%;background:${t.color}"></span>${esc(t.name)}<b>${t.score}</b></div>`).join('')}</div>` : `<p class="lead"><b>Class score: ${S.teams[0].score} points</b></p>`}
        <p class="lead" style="font-size:1rem"><b>Remember this week:</b> IF you’re thirsty THEN drink water!</p>
        <div class="row"><button class="btn go" id="againBtn">Play again</button><button class="btn ghost" id="setupBtn">Change teams</button></div>
      </div></section>`;
    sfx.win(); confetti(200);
    $('#againBtn').onclick = startGame;
    $('#setupBtn').onclick = () => { S.screen = 'setup'; render(); };
  }

  function render() {
    renderPath(); renderTeams();
    if (S.screen === 'setup') renderSetup();
    else if (S.screen === 'game') renderGame();
    else renderEnd();
  }

  // ---------- Global controls ----------
  $('#soundBtn').onclick = (e) => { sound = !sound; e.currentTarget.setAttribute('aria-pressed', sound); if (sound) sfx.tap(); };
  $('#fsBtn').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  $('#homeBtn').onclick = () => { S.screen = 'setup'; render(); };
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (S.screen !== 'game') return;
    const go = $('#goBtn'); if (go && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go.click(); return; }
    const q = Q[S.qi];
    if (S.answered) { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); } return; }
    if (q.type === 'tf') { if (/^[t1]$/i.test(e.key)) answer(0); if (/^[f2]$/i.test(e.key)) answer(1); return; }
    if (q.options && /^[1-4]$/.test(e.key) && +e.key <= q.options.length) answer(+e.key - 1);
  });

  // ---------- Boot (keeps progress across live updates) ----------
  function start(data) {
    if (data && data.S) S = Object.assign(fresh(), data.S);
    window.claude?.hot?.snapshot?.(() => ({ S: JSON.parse(JSON.stringify(S)) }));
    render();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
